<!DOCTYPE html>
<html>
<head>
    <title>Anonymous Suggestion System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Anonymous Suggestion System</h2>

    <form action="/submit/" method="POST">
        {% csrf_token %}

        <label>Department</label>
        <select name="department">
            <option>Engineering</option>
            <option>HR</option>
            <option>Sales</option>
        </select>

        <label>Suggestion</label>
        <textarea name="suggestion" rows="5" placeholder="Enter your suggestion..."></textarea>

        <button type="submit">Submit Suggestion</button>
    </form>

</div>

</body>
</html>
